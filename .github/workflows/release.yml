name: Release

on:
  push:
    branches: [main]
  # Manual re-publish of the current main version, e.g. after a failed publish job.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a release PR open per package; merging it tags the release and triggers the publish below.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      ui-released: ${{ steps.release.outputs['packages/ui--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish-ui:
    needs: release-please
    if: needs.release-please.outputs.ui-released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Packages authenticates with the workflow's GITHUB_TOKEN; this grants it publish rights.
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@masmeert"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @masmeert/ui build
      # pnpm pack rewrites `catalog:` ranges to real versions; npm publish of the raw folder would ship them verbatim.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/ui
      # Run outside the repo: npm rejects the root package.json's pnpm devEngines.
      - run: npm publish ./masmeert-ui-*.tgz
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
