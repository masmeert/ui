name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a release PR open per package; merging it tags the release and triggers the publish below.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      ui-released: ${{ steps.release.outputs['packages/ui--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish-ui:
    needs: release-please
    if: needs.release-please.outputs.ui-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a short-lived publish credential; no NPM_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @masmeert/ui build
      - run: npm publish --access public
        working-directory: packages/ui
