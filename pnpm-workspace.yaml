packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.9.0
  "@oxlint/plugins": 1.77.0
  "@types/node": ^24
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  date-fns: ^4.4.0
  lenis: ^1.3.27
  "@tabler/icons-react": ^3.49.0
  motion: ^13.5.1
  react-day-picker: ^10.0.2
  recharts: 3.8.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
